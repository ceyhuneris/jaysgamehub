 await new Promise(r=>b.onclick=r);b.hidden=true;
 d.classList.add('rl');for(let i=0;i<10;i++){d.textContent=1+Math.random()*3|0;S.tick();await sleep(80)}
 const r=1+Math.random()*3|0;d.textContent=r;d.classList.remove('rl');S.pop();await sleep(400);
 await moveTo(p,p.pos+r);
 if(p.pos<13){if(CH.includes(p.pos))await chance(p);
  else{openOv();const ok=await ask(p);closeOv();if(ok===false)await moveTo(p,p.pos-1,true)}}
 if(p.pos==13&&await finale(p))return win(p);
 cur=(cur+1)%P.length;turn();
}
</script></body></html>
